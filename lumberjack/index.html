<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lumberjack vs. the Plants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #000;
      }
      [hidden] { display: none !important; }
      #touch { display: none; }
      @media (pointer: coarse) {
        #touch { display: block; }
      }
      /* Floating joystick: touch anywhere on the left side. */
      #stick {
        position: fixed;
        inset: 0 45% 0 0;
        touch-action: none;
      }
      #stick-base, #stick-knob {
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }
      #stick-base {
        width: 120px;
        height: 120px;
        border: 3px solid rgba(255, 230, 190, 0.35);
        background: rgba(40, 24, 14, 0.25);
      }
      #stick-knob {
        width: 56px;
        height: 56px;
        background: rgba(244, 226, 192, 0.55);
        border: 3px solid rgba(42, 23, 12, 0.6);
      }
      #stick-hint {
        position: fixed;
        left: calc(24px + env(safe-area-inset-left, 0px));
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        color: rgba(244, 226, 192, 0.45);
        font: 700 13px "Pixelify Sans", monospace;
        pointer-events: none;
      }
      .acts {
        position: fixed;
        right: calc(14px + env(safe-area-inset-right, 0px));
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        width: 230px;
        height: 200px;
      }
      .acts button {
        position: absolute;
        border: 2px solid rgba(255, 230, 190, 0.35);
        border-radius: 50%;
        background: rgba(40, 24, 14, 0.28);
        color: #f4e2c0;
        font: 700 14px "Pixelify Sans", monospace;
        touch-action: none;
      }
      .acts button.on { background: rgba(176, 122, 64, 0.75); }
      .acts [data-act="jump"] { width: 92px; height: 92px; right: 0; bottom: 0; font-size: 17px; }
      .acts [data-act="chop"] { width: 80px; height: 80px; right: 104px; bottom: 6px; font-size: 16px; }
      .acts [data-act="throw"] { width: 70px; height: 70px; right: 20px; bottom: 106px; }
      .acts [data-act="pause"] { width: 44px; height: 44px; right: 132px; bottom: 120px; }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        color: #f4e2c0;
        font: 700 22px "Pixelify Sans", monospace;
        background: #0d1117;
        text-align: center;
        padding: 24px;
      }
      @media (pointer: coarse) and (orientation: portrait) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="game"></canvas></div>
    <div id="touch">
      <div id="stick"></div>
      <div id="stick-base" hidden></div>
      <div id="stick-knob" hidden></div>
      <div id="stick-hint">thumb anywhere here to move</div>
      <div class="acts">
        <button data-act="throw">THROW</button>
        <button data-act="pause">II</button>
        <button data-act="chop">CHOP</button>
        <button data-act="jump">JUMP</button>
      </div>
    </div>
    <div id="rotate">Turn your phone sideways.<br />The trees are waiting.</div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
